# Secret Scan mit gitleaks
#
# Sucht nach Zugangsdaten, Schlüsseln und Tokens im Code und in der Git-Historie.
# Läuft bei jedem Pull Request, bei jedem Push auf main und einmal pro Woche über die ganze Historie.
# Keine Kosten, keine Lizenz: gitleaks läuft als Programm (MIT-Lizenz), nicht als Marketplace-Action.
#
# Die Prüfsumme der heruntergeladenen Datei wird vor dem Entpacken kontrolliert.
# Neue gitleaks-Version: Nummer und Prüfsumme unten gemeinsam ändern (Prüfsumme steht auf der
# Release-Seite von gitleaks neben der Datei gitleaks_<Version>_linux_x64.tar.gz).
#
# Wichtig: Der Workflow prüft nach dem Push. Ein Secret, das hier gefunden wird, steht bereits im
# Repository und gilt als bekannt. Vorgehen steht in docs/SECRET_GEFUNDEN.md.
#
# Dieser Workflow bleibt bewusst nur lesend (contents: read). Bei einem Fund legt er eine bereinigte
# Fundliste ohne Werte, ohne Namen und ohne E-Mail-Adressen als Artefakt ab. Den Hinweis-Pull-Request
# erzeugt der getrennte Workflow secret-scan-hinweis.yml, der nur arbeitet, wenn die Repository-Variable
# SECRET_HINWEIS_PR auf "true" steht.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      nur_aenderungen:
        description: "Nur die Änderungen dieses Branches gegenüber dem Standard-Branch prüfen (statt der ganzen Historie)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken, volle Historie
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks installieren, Prüfsumme kontrollieren
        run: |
          set -euo pipefail
          datei="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${datei}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${datei}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${datei}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${datei}" -C "${RUNNER_TEMP}" gitleaks
          sudo install -m 0755 "${RUNNER_TEMP}/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Nach Secrets suchen
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          NUR_AENDERUNGEN: ${{ github.event.inputs.nur_aenderungen }}
          STANDARD_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Eine Datei .gitleaks.toml im Repository wird automatisch verwendet.
          # Die Marke "gitleaks:allow" im Code wird bewusst ignoriert, Ausnahmen gehören in die
          # Konfigurationsdatei und damit in einen Pull Request mit Review.
          args=(git --redact --no-banner --verbose --ignore-gitleaks-allow)
          zero="0000000000000000000000000000000000000000"
          bereich=""
          case "${EVENT_NAME}" in
            workflow_dispatch)
              if [ "${NUR_AENDERUNGEN}" = "true" ]; then
                bereich="origin/${STANDARD_BRANCH}..HEAD"
              fi
              ;;
            pull_request)
              bereich="${PR_BASE}..${PR_HEAD}"
              ;;
            push)
              if [ "${PUSH_BEFORE}" != "${zero}" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                bereich="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
          esac
          if [ -n "${bereich}" ]; then
            echo "Geprüft werden die Commits ${bereich}"
            args+=("--log-opts=${bereich}")
          else
            echo "Geprüft wird die gesamte Historie"
          fi
          # Bericht nur für die bereinigte Fundliste, wird nicht hochgeladen
          args+=(--report-format json --report-path "${RUNNER_TEMP}/gitleaks-bericht.json")
          gitleaks "${args[@]}" .

      - name: Fundliste bereinigen
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # Nur Regel, Datei, Zeile und Commit. Werte, Namen, E-Mail-Adressen und Texte bleiben draußen.
          if [ -s "${RUNNER_TEMP}/gitleaks-bericht.json" ]; then
            jq '[ .[] | {regel: .RuleID, datei: .File, zeile: .StartLine, commit: (.Commit[0:8])} ] | unique' \
              "${RUNNER_TEMP}/gitleaks-bericht.json" > "${RUNNER_TEMP}/funde.json"
          else
            echo "[]" > "${RUNNER_TEMP}/funde.json"
          fi
          echo "Funde in der Liste: $(jq length "${RUNNER_TEMP}/funde.json")"

      - name: Fundliste ablegen
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-funde
          path: ${{ runner.temp }}/funde.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Hinweis bei Fund
        if: failure()
        run: |
          {
            echo "## Secret gefunden"
            echo
            echo "gitleaks hat mögliche Zugangsdaten gemeldet. Die Fundstellen stehen im Protokoll des Schritts davor, die Werte sind geschwärzt."
            echo
            echo "1. Das Secret sofort beim Dienst widerrufen oder erneuern. Das Löschen aus dem Code reicht nicht, die Historie bleibt lesbar."
            echo "2. Danach die Datei bereinigen und bei einem Fehlalarm die Ausnahme in .gitleaks.toml per Pull Request eintragen."
            echo "3. Ablauf im Detail: docs/SECRET_GEFUNDEN.md"
          } >> "${GITHUB_STEP_SUMMARY}"
