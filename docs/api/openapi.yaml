  /api/site-management/buyer-pipeline:
    get:
      tags:
        - Sales
      operationId: getBuyerPipeline
      summary: List pipeline entries, or the stage summary.
      description: Returns the buyer pipeline. `view=summary` returns per-stage counts and values, with totals kept per currency rather than summed across them.
      x-azura-permission: buyer_pipeline:view
      x-azura-rate-limit:
        requests: 120
        windowSeconds: 60
      parameters:
        - name: view
          in: query
          required: false
          description: "`entries` (default) or `summary`."
          schema:
            type: string
            enum:
              - entries
              - summary
        - name: stage
          in: query
          required: false
          description: Filter to one pipeline stage.
          schema:
            type: string
            maxLength: 32
        - name: unitId
          in: query
          required: false
          description: Filter to one unit.
          schema:
            type: string
