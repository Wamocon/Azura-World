  /api/site-management/tickets:
    get:
      tags:
        - Operations
      operationId: getTickets
      summary: List service tickets.
      description: Returns role-scoped tickets. A service provider sees the tickets assigned to it; a resident sees the tickets for its own units.
      x-azura-permission: tickets:view
      x-azura-rate-limit:
        requests: 120
        windowSeconds: 60
      parameters:
        - name: status
          in: query
          required: false
          description: Filter to one ticket status.
          schema:
            type: string
            maxLength: 32
        - name: openOnly
          in: query
          required: false
          description: Keep only tickets that are not resolved, closed or cancelled.
          schema:
            type: boolean
        - name: priority
          in: query
          required: false
          description: Filter to one priority.
          schema:
            type: string
            maxLength: 16
        - name: slaBreachedOnly
          in: query
          required: false
          description: Keep only non-terminal tickets whose SLA due time has passed.
          schema:
            type: boolean
        - name: unitId
          in: query
          required: false
          description: Filter to one unit.
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to [1, 500]; anything larger is clamped, not rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Rows to skip. Negative values are clamped to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
        - Operations
      operationId: createTicket
      summary: Open a service ticket.
      description: Files a new, untriaged ticket. The requester is the session. Status, assignee and cost are not accepted as input — a ticket is born `open` and unassigned, and triage is a separate staff action. A resident may file against a unit they hold or against the common areas; the database enforces that, not this handler.
      x-azura-permission: tickets:create
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: ticket.created
        entity: service_tickets
      x-azura-idempotent: true
      requestBody:
        required: true
        description: Validated by `createTicketSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
    patch:
      tags:
        - Operations
      operationId: updateTicketStatus
      summary: Move a ticket to another status.
      description: Applies an optimistically-concurrent status change. `expectedVersion` is the version the caller read; a mismatch is a 409 and never a silent overwrite. Returns 503 rather than 200 if the write could not be persisted.
      x-azura-permission: tickets:update
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: ticket.status_changed
        entity: service_tickets
      requestBody:
        required: true
        description: Validated by `updateTicketStatusSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
  /api/site-management/users:
    get:
      tags:
        - Governance
      operationId: getProfiles
      summary: List profiles, guardianships, or audit events.
      description: "Returns governance records. Governance is not part of the public showcase: an anonymous caller sees nothing here regardless of parameters."
      x-azura-permission: users:view
      x-azura-rate-limit:
        requests: 120
        windowSeconds: 60
      parameters:
        - name: view
          in: query
          required: false
          description: "`profiles` (default), `guardianships`, `audit`, or `access`."
          schema:
            type: string
            enum:
              - profiles
              - guardianships
              - audit
              - access
        - name: subjectRole
          in: query
          required: false
          description: Filter profiles by the role stored on the row, not the caller's role.
          schema:
            type: string
            maxLength: 24
        - name: isActive
          in: query
          required: false
          description: Filter profiles by active state.
          schema:
            type: boolean
        - name: decision
          in: query
          required: false
          description: With `view=access`, filter to `allow` or `deny`.
          schema:
            type: string
            enum:
              - allow
              - deny
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to [1, 500]; anything larger is clamped, not rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Rows to skip. Negative values are clamped to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
        - Governance
      operationId: createProfile
      summary: Create a person's record.
      description: "Creates the profile row and its role. It does NOT create a sign-in account: auth.users is written by Supabase Auth's admin API, which needs the service-role key and a mail path, and neither is configured here. The response says so rather than implying an invitation was sent."
      x-azura-permission: users:create
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: profile.created
        entity: profiles
      x-azura-idempotent: true
      requestBody:
        required: true
        description: Validated by `createProfileSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
    patch:
      tags:
        - Governance
      operationId: updateProfileRole
      summary: Change a person's role or active state.
      description: "The highest-authority mutation in this system. Two guards apply, both in Postgres: the last active administrator of a company cannot be demoted or deactivated (409), and a self-elevation is recorded in audit_events with metadata.selfElevation = true rather than refused. expectedVersion is compared against profiles.version."
      x-azura-permission: users:manage
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: profile.authority_changed
        entity: profiles
      requestBody:
        required: true
        description: Validated by `updateProfileRoleSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
    delete:
      tags:
        - Governance
      operationId: deleteProfile
      summary: Delete a person's record.
      description: Succeeds only for somebody who has never acted. audit_events.actor_profile_id references profiles(id) ON DELETE RESTRICT, so deleting an actor would take the record of their actions with them and Postgres refuses; the 409 names deactivation as the alternative. The last-administrator guard applies here too.
      x-azura-permission: users:delete
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: profile.deleted
        entity: profiles
      requestBody:
        required: true
        description: Validated by `deleteProfileSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
