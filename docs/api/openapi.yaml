        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/site-management/dashboard:
    get:
      tags:
        - Dashboard
      operationId: getDashboardSnapshot
      summary: Get the role-scoped dashboard snapshot.
      description: Returns the KPI snapshot for the caller's role. The four module sections are populated only where the role holds the matching permission; a section the role cannot see is absent, not empty.
      x-azura-permission: dashboard:view
      x-azura-rate-limit:
