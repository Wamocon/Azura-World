    post:
      tags:
        - Communications
      operationId: createMessage
      summary: Post a message to a thread.
      description: Appends one message to a thread the caller can already read. The sender is the session, never the payload. Returns 404 rather than 403 for a thread the caller cannot see, so the endpoint does not confirm that an invisible thread exists.
      x-azura-permission: communications:create
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: message.created
        entity: messages
      x-azura-idempotent: true
      requestBody:
        required: true
        description: Validated by `createMessageSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
