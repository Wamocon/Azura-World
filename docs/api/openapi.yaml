              - messages
              - notifications
        - name: threadId
          in: query
          required: false
          description: Required with `view=messages`.
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          required: false
          description: Filter threads to one status.
          schema:
            type: string
            maxLength: 32
        - name: unreadOnly
          in: query
          required: false
          description: With `view=notifications`, keep only unread ones.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
