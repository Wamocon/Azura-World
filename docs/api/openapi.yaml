  /api/site-management/communications:
    get:
      tags:
        - Communications
      operationId: getCommunications
      summary: List threads, messages, or notifications.
      description: Returns role-scoped communications. `view=messages` requires `threadId`; access to the thread is checked before its messages are read, so a thread id the caller cannot see yields nothing.
      x-azura-permission: communications:view
      x-azura-rate-limit:
        requests: 120
        windowSeconds: 60
      parameters:
        - name: view
          in: query
