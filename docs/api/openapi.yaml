              - checks
        - name: expiringWithinDays
          in: query
          required: false
          description: Keep only documents expiring within this many days.
          schema:
            type: integer
            minimum: 0
            maximum: 3650
        - name: humanDecisionRequired
          in: query
          required: false
          description: With `view=checks`, narrow to the queue a human still has to clear.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to [1, 500]; anything larger is clamped, not rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
