# Generated by scripts/generate-openapi.mjs from apps/web/lib/api-routes.ts.
# Do not edit by hand: `pnpm test:contract` rebuilds this file and fails on any
# difference, so a manual edit is reverted rather than kept.
openapi: "3.1.0"
info:
  title: Azura World CATI API
  version: "2026.07.28"
  summary: Evidence-backed property-management API for Azura World Residence & Hotel.
  description: "Generated from `apps/web/lib/api-routes.ts`. Do not edit this file by hand: `pnpm test:contract` rebuilds it from the manifest and fails if the result differs by a single byte, so a manual edit is reverted by the next check rather than adopted.\n\nEvery response is the envelope in `CONTRACTS.md` §5. Success is `{ ok: true, data, source, requestId }`, where `source` reports whether the data came from the database or from local seed data — a read may be answered from seed data and says so, and a write never is.\n\nOperations marked `x-azura-write-gap` have no implementation behind them and answer 503. They are documented rather than hidden because an endpoint that silently does nothing is worse than one that says it cannot."
servers:
  - url: http://127.0.0.1:3200
    description: Local development.
tags:
  - name: Dashboard
    description: Role-scoped overview and cross-module search.
  - name: Evidence
    description: Sources, findings and the dataset's own coverage report.
  - name: Inventory
    description: Site, blocks, floors and the 656 units.
  - name: Listings
    description: Captured external portal listings and their disagreements.
  - name: Hotel
    description: The hotel, its rooms and guest-review evidence.
  - name: Sales
    description: Leads and the buyer pipeline.
  - name: Finance
    description: Ledger, wallets, vendor invoices and payments.
  - name: Operations
    description: Service tickets, activities and media reports.
  - name: Documents
    description: Document metadata and short-lived signed URLs.
  - name: Communications
    description: Threads, messages and notifications.
  - name: Governance
    description: Profiles, guardianships, audit and compliance.
  - name: Commands
    description: The audited write endpoint.
  - name: Public
    description: Unauthenticated intake.
  - name: Calendar
    description: Token-scoped iCalendar feeds.
  - name: AI
    description: Retrieval-grounded assistants. Owned by W2-C.
  - name: Meta
    description: The API's description of itself, and QA role switching.
components:
  securitySchemes:
    SupabaseSession:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: The Supabase Auth session cookie. Role and permissions are resolved server-side from the session; nothing about authority is read from the request body or query string.
    AccessProfileCookie:
      type: apiKey
      in: cookie
      name: azura_access_profile
      description: A local-QA role cookie, accepted only when access profiles are enabled and never in production — `lib/access-profile-policy.ts` throws at module load if that combination is ever configured.
  schemas:
    ApiError:
      type: object
      required:
        - ok
        - error
        - requestId
      properties:
        ok:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation_failed
                - rate_limited
                - conflict
                - persistence_unavailable
                - upstream_failed
            message:
              type: string
              description: Display copy, safe to show a user. Never a database message, a stack frame or a file path.
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
          description: Also written to the server log, so a support conversation can join a user's report to the server's record of it.
    ApiSuccess:
      type: object
      required:
        - ok
        - data
        - source
        - requestId
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          description: The operation's payload.
        source:
          type: string
          enum:
            - supabase
            - local-seed
          description: Where the data came from. `local-seed` on a read means the database was unreachable and this is fallback data; it never appears on a successful write, because a simulated write is reported as 503 instead.
        requestId:
          type: string
    JsonObject:
      type: object
      additionalProperties: true
  responses:
    Success:
      description: The request succeeded.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiSuccess"
    ValidationFailed:
      description: "The request was malformed: a bad body, an unknown property, a missing required parameter, or a body over 32 KB."
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    Unauthorized:
      description: No session. Sign in and retry.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    Forbidden:
      description: The authenticated role does not hold the required permission. Deliberately indistinguishable from a resource that does not exist.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    NotFound:
      description: No such resource, or none the caller may see. The two are not distinguished, so this endpoint cannot be used to enumerate ids.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    Conflict:
      description: The record changed since it was read (`expectedVersion` mismatch), or an `Idempotency-Key` was reused with a different body.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    RateLimited:
      description: Too many requests. `Retry-After` gives the number of seconds to wait.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
    PersistenceUnavailable:
      description: The change was NOT saved. Either the database is not configured, the write did not land, or this operation has no implementation yet (`x-azura-write-gap`). Never returned in place of a success.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiError"
security:
  - SupabaseSession: []
  - AccessProfileCookie: []
paths:
  /api/access-profile:
    get:
      tags:
        - Meta
      operationId: getAccessProfile
      summary: Read the current QA access profile.
      description: "Local-QA role switching. Not a production authentication path: `lib/access-profile-policy.ts` throws at module load if access profiles are ever enabled in production, so this endpoint cannot exist there. Owned by W1-B."
      security: []
      x-azura-public-justification: It is the mechanism by which a QA session acquires a role, so it cannot itself require one. It is inert unless ENABLE_ACCESS_PROFILES is set, and enabling it in production is a startup failure rather than a configuration choice.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
        - Meta
      operationId: setAccessProfile
      summary: Adopt a QA access profile role.
      description: "Local-QA role switching. Not a production authentication path: `lib/access-profile-policy.ts` throws at module load if access profiles are ever enabled in production, so this endpoint cannot exist there. Owned by W1-B."
      security: []
      x-azura-public-justification: It is the mechanism by which a QA session acquires a role, so it cannot itself require one. It is inert unless ENABLE_ACCESS_PROFILES is set, and enabling it in production is a startup failure rather than a configuration choice.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
    delete:
      tags:
        - Meta
      operationId: clearAccessProfile
      summary: Clear the QA access profile.
      description: "Local-QA role switching. Not a production authentication path: `lib/access-profile-policy.ts` throws at module load if access profiles are ever enabled in production, so this endpoint cannot exist there. Owned by W1-B."
      security: []
      x-azura-public-justification: It is the mechanism by which a QA session acquires a role, so it cannot itself require one. It is inert unless ENABLE_ACCESS_PROFILES is set, and enabling it in production is a startup failure rather than a configuration choice.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/ai/chat:
    post:
      tags:
        - AI
      operationId: postAiChat
      summary: Ask the authenticated AI concierge.
      description: Role-aware retrieval-grounded chat. Refuses rather than answers when retrieval returns no grounding, and performs the RBAC check before any outbound request. Owned by W2-C.
      x-azura-permission: dashboard:view
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/ai/public-chat:
    post:
      tags:
        - AI
      operationId: postPublicAiChat
      summary: Ask the public AI assistant.
      description: Unauthenticated assistant restricted to the public showcase knowledge base. Owned by W2-C.
      security: []
      x-azura-public-justification: It answers questions from prospective buyers who have no account, over a knowledge base that contains only already-published material, and refuses anything it cannot ground in that material.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/ai/public-chat/feedback:
    post:
      tags:
        - AI
      operationId: postPublicAiFeedback
      summary: Rate a public AI answer.
      description: Records a thumbs-up or thumbs-down against a public assistant answer. Owned by W2-C.
      security: []
      x-azura-public-justification: It is attached to the unauthenticated assistant above and accepts only a rating against an answer id — no free text, no identifiers.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/ai/public-chat/stream:
    post:
      tags:
        - AI
      operationId: postPublicAiChatStream
      summary: Ask the public AI assistant, streamed.
      description: The streaming form of the public assistant, returning server-sent events. Owned by W2-C.
      security: []
      x-azura-public-justification: Same surface and same guardrails as the non-streaming public assistant; only the response encoding differs.
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/calendar/ics/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The token of the resource.
        schema:
          type: string
          maxLength: 64
    get:
      tags:
        - Calendar
      operationId: getCalendarFeed
      summary: Get an iCalendar feed for a subscription token.
      description: "Returns a `text/calendar` feed of site activities for the given opaque subscription token. There is no session: the token IS the credential, so it is compared in constant time and a bad token is reported as not found rather than forbidden, to keep the endpoint from confirming which tokens exist."
      security: []
      x-azura-public-justification: Calendar clients cannot carry a session cookie. The token is opaque, single-purpose, read-only, grants access to activity times only, and is checked in constant time.
      x-azura-rate-limit:
        requests: 30
        windowSeconds: 60
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "404":
          "$ref": "#/components/responses/NotFound"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/openapi:
    get:
      tags:
        - Meta
      operationId: getOpenApiDocument
      summary: Get this API's OpenAPI document.
      description: Serves `docs/api/openapi.yaml` verbatim. The document is generated from the route manifest, so what this returns is what the code declares — it cannot describe an endpoint that does not exist, or omit one that does.
      security: []
      x-azura-public-justification: The spec describes only the shape of the surface, which an unauthenticated caller can discover by probing anyway. Publishing it costs nothing and makes the parity guarantee externally checkable.
      x-azura-rate-limit:
        requests: 30
        windowSeconds: 60
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  /api/site-management/actions:
    post:
      tags:
        - Commands
      operationId: executeCommand
      summary: Execute a domain command.
      description: "The one write endpoint backed by real repository mutations. The body is a discriminated union on `command`, and each command declares its own permission, which is checked in addition to the endpoint's. Supported: `ticket.appendEvent`, `ticket.updateStatus`, `ledger.reverseEntry`, `vendorInvoice.settle`. Commands carrying `expectedVersion` are optimistically concurrent: a mismatch is 409, never a silent overwrite. Every outcome writes an audit row."
      x-azura-permission: dashboard:view
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: command.executed
        entity: audit_events
      x-azura-idempotent: true
      requestBody:
        required: true
        description: Validated by `commandSchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/JsonObject"
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/PersistenceUnavailable"
  /api/site-management/activities:
    get:
      tags:
        - Operations
      operationId: getActivities
      summary: List site activities.
      description: Returns scheduled and completed site activities.
      x-azura-permission: activities:view
      x-azura-rate-limit:
        requests: 120
        windowSeconds: 60
      parameters:
        - name: status
          in: query
          required: false
          description: Filter to one activity status.
          schema:
            type: string
            maxLength: 32
        - name: category
          in: query
          required: false
          description: Filter to one category.
          schema:
            type: string
            maxLength: 32
        - name: upcomingOnly
          in: query
          required: false
          description: Keep only activities that have not started yet.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to [1, 500]; anything larger is clamped, not rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Rows to skip. Negative values are clamped to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          "$ref": "#/components/responses/Success"
        "400":
          "$ref": "#/components/responses/ValidationFailed"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
        - Operations
      operationId: createActivity
      summary: Schedule an activity.
      description: "Not implemented: no repository write path exists for activities."
      x-azura-permission: activities:create
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: activity.created
        entity: activities
      x-azura-idempotent: true
      x-azura-write-gap:
        reason: "Scheduling an activity is not implemented: no repository write path exists yet."
        owner: W2-A (repository mutations)
      requestBody:
        required: true
        description: Validated by `createActivitySchema` in `lib/validation/schemas.ts`. Unknown properties are rejected.
        content:
