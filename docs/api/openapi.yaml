      operationId: updateBuyerPipelineEntry
      summary: Move a pipeline entry to another stage.
      description: "Not implemented: no repository write path exists for the pipeline. Authorised and validated, then 503."
      x-azura-permission: buyer_pipeline:update
      x-azura-rate-limit:
        requests: 20
        windowSeconds: 60
      x-azura-audit:
        action: pipeline_entry.stage_changed
        entity: buyer_pipeline_entries
      x-azura-write-gap:
        reason: "Moving a pipeline entry is not implemented: no repository write path exists yet."
        owner: W2-A (repository mutations)
      requestBody:
